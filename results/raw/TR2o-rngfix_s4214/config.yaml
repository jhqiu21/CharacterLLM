model_name: TR2o-nomask
model:
  type: transformer
  vocab_size: 27
  d_model: 256
  n_heads: 4
  n_layers: 4
  max_len: 128
  mlp_ratio: 4
  emb_dropout: 0.1
  mlp_dropout: 0.1
  attn_dropout: 0.1
  resid_dropout: 0.1
  pos_encoding_type: rope
loss:
  LABEL_SMOOTHING: true
  ls_eps: 0.05
  entropy_lambda: 0.0
  tail_scheme: linear
scheduler:
  warmup_iters: 2000
  init_value: 0.0
  end_value: 0.0
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  grad_clip_norm: 1.0
  decay_mask: false
training:
  batch_size: 128
  sequence_length: 128
  learning_rate: 0.0004
  epochs: 50000
  validation_interval: 500
  stage_checkpoint_interval: 10000
  seed: 4214
evaluation:
  sample: true
  seed: 4212
  prompt: hello my fri
  gen_len: 1000
  temperature: 0.7
  self_belu_n_grams: 4
  self_belu_n_samples: 20
  full_context_stride: 1
  full_context_batch_size: 8192
output:
  checkpoint_dir: ./checkpoints
  results_dir: ./runs
run:
  run_name: TR2o-rngfix_s4214
  seed: 4214
  legacy_dropout_rng: false
  config_file: configs/TR2o-nomask.yaml
  overrides: {}
  git_commit: 357807f6f75051ac763080c687584007018c05cb

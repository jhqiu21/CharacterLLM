model_name: TR-final
model:
  type: transformer
  vocab_size: 27
  d_model: 256
  n_heads: 4
  n_layers: 4
  max_len: 512
  mlp_ratio: 4
  emb_dropout: 0.0
  mlp_dropout: 0.0
  attn_dropout: 0.0
  resid_dropout: 0.0
  pos_encoding_type: rope
  sinusoidal_scale: unit
  pos_scale: 1.0
loss:
  LABEL_SMOOTHING: true
  ls_eps: 0.0
  entropy_lambda: 0.0
  tail_scheme: linear
scheduler:
  warmup_iters: 50
  init_value: 0.0
  end_value: 0.0
optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  grad_clip_norm: 1.0
  decay_mask: true
training:
  batch_size: 32
  sequence_length: 512
  learning_rate: 3.0e-05
  epochs: 1000
  validation_interval: 50
  stage_checkpoint_interval: 10000
  seed: 42
evaluation:
  sample: true
  seed: 4212
  prompt: hello my fri
  gen_len: 1000
  temperature: 0.7
  self_belu_n_grams: 4
  self_belu_n_samples: 20
  full_context_stride: 1
  full_context_batch_size: 256
  self_bleu_multi_n_prompts: 10
  self_bleu_multi_n_samples: 20
  self_bleu_multi_prompt_len: 128
  tuning_val_stride: 128
output:
  checkpoint_dir: ./checkpoints
  results_dir: ./runs
run:
  run_name: ft-long512_lr3e-5_s42
  seed: 42
  legacy_dropout_rng: false
  tuning: true
  config_file: configs/final/TR.yaml
  overrides:
    training.learning_rate: 3.0e-05
    model.max_len: 512
    training.sequence_length: 512
    training.batch_size: 32
    training.epochs: 1000
    scheduler.warmup_iters: 50
    training.validation_interval: 50
    evaluation.tuning_val_stride: 128
    evaluation.full_context_batch_size: 256
  git_commit: 7bbc2274027700cd2dd5807e594c8e5adfbf4fe9-dirty
  init_from: TR-final_s42
  init_from_step: 49999

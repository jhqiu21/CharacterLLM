# Conda environment used for every result in results/ (versions as in results/v3/env.txt).
#   conda env create -f environment.yml && conda activate charllm-env
# GPU: jax[cuda12] brings its own CUDA 12 libraries (pip wheels). If a system CUDA in LD_LIBRARY_PATH shadows them
# (JAX then fails with "Unable to load cuSPARSE" and falls back to the CPU), remove /usr/local/cuda* from LD_LIBRARY_PATH.
# CPU only: replace "jax[cuda12]==0.6.2" with "jax==0.6.2". The test suite runs on the CPU in either case.
name: charllm-env
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10
  - pip
  - pip:
      - "jax[cuda12]==0.6.2"
      - flax==0.10.7
      - optax==0.2.8
      - numpy==2.2.6
      - matplotlib==3.10.9
      - pyyaml==6.0.3
      - nltk==3.10.3           # Self-BLEU in utils/eval.py
      # notebook (transformer.ipynb)
      - jupyterlab
      - ipykernel
      - nbclient==0.11.0
      # tests and code style
      - pytest==9.1.1
      - ruff
      - nbqa==1.9.1
      - pre-commit
